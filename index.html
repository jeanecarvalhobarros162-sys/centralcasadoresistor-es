    <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-amber-500/90">${p.category}</p>
    <h3 class="font-grotesk text-base font-semibold leading-snug text-zinc-100">${p.name}</h3>
    <p class="text-xs text-zinc-500">${p.specs}</p>
    <div class="mt-auto flex items-end justify-between pt-3">
      <p class="font-display text-3xl font-bold text-white">${brl(p.price)}</p>
      <div class="flex items-center rounded-full border border-white/15">
        <button onclick="bumpQty('${p.id}',-1)" class="p-2 text-zinc-400 hover:text-amber-400">−</button>
        <span id="qty-${p.id}" class="w-7 text-center font-mono text-sm text-white">1</span>
        <button onclick="bumpQty('${p.id}',1)" class="p-2 text-zinc-400 hover:text-amber-400">+</button>
      </div>
    </div>
    <button onclick="add('${p.id}')" class="mt-2 rounded-xl border border-amber-500/40 bg-amber-500/10 py-3 font-mono text-[11px] font-bold uppercase tracking-[0.18em] text-amber-400 hover:bg-amber-500 hover:text-black">Adicionar ao carrinho</button>
  </div>
</article>`).join("");

// Relógio / status
setInterval(() => {
  const sp = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
  document.getElementById("clock").textContent = sp.toLocaleTimeString("pt-BR", { hour12: false });
  const d = sp.getDay(), h = sp.getHours();
  const open = (d >= 1 && d <= 5 && h >= 8 && h < 18) || (d === 6 && h >= 8 && h < 12);
  const el = document.getElementById("store-status");
  el.textContent = open ? "Aberto agora" : "Fechado";
  el.className = "rounded-full px-3 py-1 font-mono text-[10px] font-bold uppercase tracking-widest " + (open ? "bg-emerald-500/15 text-emerald-400" : "bg-red-500/15 text-red-400");
}, 1000);

const qtys = {};
PRODUCTS.forEach(p => qtys[p.id] = 1);
function bumpQty(id, d) { qtys[id] = Math.min(99, Math.max(1, qtys[id] + d)); document.getElementById("qty-" + id).textContent = qtys[id]; }
function add(id) {
  const p = PRODUCTS.find(x => x.id === id);
  const found = cart.find(i => i.id === id);
  if (found) found.qty += qtys[id]; else cart.push({ ...p, qty: qtys[id] });
  renderBadge(); openCart();
}
function renderBadge() {
  const b = document.getElementById("cart-badge");
  const n = cart.reduce((a, i) => a + i.qty, 0);
  b.textContent = n; b.style.display = n ? "flex" : "none";
}
function subtotal() { return cart.reduce((a, i) => a + i.price * i.qty, 0); }
function openCart() {
  const wrap = document.getElementById("drawer-wrap"), drawer = document.getElementById("drawer");
  wrap.classList.remove("hidden");
  requestAnimationFrame(() => drawer.classList.remove("translate-x-full"));
  step = "cart"; renderCart();
}
function closeCart() {
  const wrap = document.getElementById("drawer-wrap"), drawer = document.getElementById("drawer");
  drawer.classList.add("translate-x-full");
  setTimeout(() => wrap.classList.add("hidden"), 300);
}
let step = "cart";
function renderCart() {
  const body = document.getElementById("drawer-body"), title = document.getElementById("drawer-title");
  if (step === "cart") {
    title.textContent = cart.length ? `Carrinho (${cart.reduce((a,i)=>a+i.qty,0)})` : "Carrinho";
    if (!cart.length) {
      body.innerHTML = `<div class="flex h-full flex-col items-center justify-center gap-5 text-center"><p class="text-sm text-zinc-400">Seu carrinho está vazio.<br/>Explore o catálogo e adicione produtos.</p><a href="#catalogo" onclick="closeCart()" class="rounded-full bg-amber-500 px-6 py-3 font-mono text-[11px] font-bold uppercase tracking-[0.15em] text-black">Explorar catálogo</a></div>`;
      return;
    }
    body.innerHTML = `<ul class="space-y-4">${cart.map(i => `
      <li class="flex gap-4 rounded-xl border border-white/10 bg-carbon-800/60 p-3">
        <img src="${i.image}" alt="" class="h-20 w-16 rounded-lg object-cover"/>
        <div class="flex flex-1 flex-col"><p class="text-xs font-semibold text-zinc-100">${i.name}</p>
        <p class="mt-1 font-mono text-[11px] text-amber-500">${brl(i.price)} un.</p>
        <div class="mt-auto flex items-center justify-between pt-2">
          <div class="flex items-center gap-3 rounded-full border border-white/15 px-2">
            <button onclick="cqty('${i.id}',-1)" class="text-zinc-400">−</button><span class="font-mono text-xs text-white">${i.qty}</span><button onclick="cqty('${i.id}',1)" class="text-zinc-400">+</button>
          </div>
          <button onclick="rm('${i.id}')" class="text-xs text-zinc-600 hover:text-red-400">remover</button>
        </div></div></li>`).join("")}</ul>
      <div class="mt-6 flex items-center justify-between border-t border-white/10 pt-5">
        <span class="font-mono text-[11px] uppercase tracking-[0.2em] text-zinc-400">Subtotal</span>
        <span class="font-display text-3xl font-bold text-white">${brl(subtotal())}</span>
      </div>
      <button onclick="goCheckout()" class="mt-6 w-full rounded-xl bg-amber-500 py-4 font-mono text-xs font-bold uppercase tracking-[0.18em] text-black hover:bg-kinetic hover:text-white">Finalizar pedido</button>`;
  } else if (step === "checkout") {
    title.textContent = "Finalizar pedido";
    body.innerHTML = `
    <form onsubmit="finish('wa');return false" class="space-y-4">
      ${[["name","Nome completo / Razão social *","Seu nome ou empresa"],["doc","CNPJ ou CPF *","00.000.000/0000-00"],["phone","Telefone / WhatsApp *","(11) 90000-0000"],["zip","CEP *","13201-001"],["street","Logradouro *","Rua, avenida…"],["number","Número *","162"],["district","Bairro *","Centro"],["city","Município *","Jundiaí"],["state","UF *","SP"],["notes","Observações","Opcional"]].map(([k,l,ph]) => `
      <label class="block"><span class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.2em] text-zinc-500">${l}</span>
      <input id="f-${k}" placeholder="${ph}" class="w-full rounded-lg border border-white/10 bg-black/40 px-3.5 py-2.5 text-sm text-white outline-none focus:border-amber-500/70"/></label>`).join("")}
      <div class="flex items-center justify-between rounded-xl border border-white/10 bg-black/30 px-4 py-3">
        <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-zinc-500">Subtotal</span>
        <span class="font-display text-2xl font-bold text-white">${brl(subtotal())}</span>
      </div>
      <button type="submit" class="w-full rounded-xl bg-emerald-500 py-4 font-mono text-xs font-bold uppercase tracking-[0.15em] text-black">Enviar pedido via WhatsApp</button>
      <button type="button" onclick="finish('mail')" class="w-full rounded-xl border border-amber-500/40 bg-amber-500/10 py-4 font-mono text-xs font-bold uppercase tracking-[0.15em] text-amber-400">Enviar cotação por e-mail</button>
    </form>`;
  } else {
    title.textContent = "Pedido enviado";
    body.innerHTML = `<div class="flex h-full flex-col items-center justify-center gap-5 text-center"><p class="text-4xl">✅</p><p class="font-grotesk text-lg font-semibold text-white">Pedido preparado com sucesso!</p><p class="text-sm text-zinc-400">Finalize o envio na janela que abrimos. Atendimento pelo ${COMPANY.phones[0]} ou ${COMPANY.email}.</p><button onclick="location.reload()" class="rounded-full bg-amber-500 px-7 py-3.5 font-mono text-[11px] font-bold uppercase tracking-[0.15em] text-black">Continuar comprando</button></div>`;
  }
}
function cqty(id, d) {
  const it = cart.find(i => i.id === id);
  it.qty = Math.min(99, Math.max(1, it.qty + d));
  renderBadge(); renderCart();
}
function rm(id) { cart = cart.filter(i => i.id !== id); renderBadge(); renderCart(); }
function goCheckout() { step = "checkout"; renderCart(); }
function buildText() {
  const g = k => document.getElementById("f-" + k).value;
  const items = cart.map(i => `- ${i.qty}x ${i.name} — ${brl(i.price)} un. (total ${brl(i.price * i.qty)})`).join("\n");
  return `Olá ${COMPANY.tradeName}! Gostaria de confirmar meu pedido feito pelo site:\n\n*ITENS:*\n${items}\n*SUBTOTAL:* ${brl(subtotal())}\n\n*DADOS DO CLIENTE:*\n- Nome: ${g("name")}\n- CNPJ/CPF: ${g("doc")}\n- Telefone: ${g("phone")}\n- Endereço: ${g("street")}, ${g("number")}, ${g("district")}, ${g("zip")}\n- Cidade/UF: ${g("city")} - ${g("state")}${g("notes") ? `\n- Obs: ${g("notes")}` : ""}\n\n*FRETE:* a combinar (retirada grátis no Centro de Jundiaí)`;
}
function finish(mode) {
  const req = ["name","doc","phone","zip","street","number","district","city","state"];
  for (const k of req) { if (!document.getElementById("f-" + k).value.trim()) { alert("Preencha todos os campos obrigatórios do endereço."); return; } }
  const text = buildText();
  if (mode === "wa") window.open(wa(text), "_blank");
  else window.location.href = `mailto:${COMPANY.email}?subject=${encodeURIComponent("Pedido via site — Compél Jundiaí")}&body=${encodeURIComponent(text)}`;
  cart = []; renderBadge(); step = "done"; renderCart();
}
</script>
</body>
</html>
